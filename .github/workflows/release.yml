name: Release

# Al subir un tag vX.Y.Z: comprueba, firma y publica el APK como GitHub Release (plan.md §8.2).
# Secretos y cómo crear la clave: docs/release.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: El tag coincide con version.properties y CHANGELOG.md
        run: python3 tools/release-notes.py check "$GITHUB_REF_NAME"

      # Sin la clave no se publica nada: una release sin firmar no se podría actualizar encima.
      - name: Clave de firma
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto SIGNING_KEYSTORE_B64 (docs/release.md)"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check y APK firmado
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="wh01s17-launcher-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-$version.txt"
          python3 tools/release-notes.py notes "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" "mapping-$version.txt" \
            --title "wh01s17 Launcher $version" --notes-file notes.md

      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
